[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chattrace"
version = "0.4.0"
description = "Local WeChat 4.x (4.1.11+) chat toolchain: KeyAgent capture, guided Web UI, decrypt, browse, media playback + txt/json/html export."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ChatTrace Maintainers" }]
keywords = ["wechat", "wcdb", "sqlcipher", "frida", "local-first", "windows", "webui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = [
  "frida>=16.0.0",
  "pycryptodomex>=3.20",
  "zstandard>=0.22",
  "silk-python>=0.2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
chattrace = "chattrace.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
