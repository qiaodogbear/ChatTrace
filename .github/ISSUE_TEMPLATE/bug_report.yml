name: 🐞 Bug 报告
description: 报告一个可复现的问题（密钥获取、解密、浏览、导出等）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 请先阅读

        1. 先看 [新手图文指南](../blob/main/docs/beginner_guide.md) 的 **FAQ** 与 **错误码对照表**，多数问题已有答案；
        2. **绝对不要**在本 Issue 里粘贴：数据库主密钥（64 位 hex）、完整聊天明文、他人隐私数据、密钥文件内容。
           需要说明密钥相关问题时，只提供**指纹前 8 位**即可。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？你期望发生什么？
      placeholder: |
        例：点击「重新获取密钥」后，微信被拉起但界面一直停在“等待登录…”，最后报 ERR_LOGIN_TIMEOUT。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 第 1 步选择账号目录 …
        2. 第 2 步点击「重新获取密钥」…
        3. 观察到 …
    validations:
      required: true

  - type: input
    id: chattrace-version
    attributes:
      label: ChatTrace 版本
      description: 发布包版本号（如 0.3.0），源码运行请填提交号
      placeholder: "0.3.0"
    validations:
      required: true

  - type: input
    id: wechat-version
    attributes:
      label: 微信版本
      description: 微信「设置 → 关于微信」中的版本号
      placeholder: "4.1.12.55"
    validations:
      required: true

  - type: dropdown
    id: run-mode
    attributes:
      label: 运行方式
      options:
        - 发布包（解压后双击 ChatTrace.exe）
        - 源码（pip install -e . 后运行 chattrace ...）
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: 出问题的阶段
      options:
        - 第 1 步 · 选择账号
        - 第 2 步 · 获取密钥
        - 第 3 步 · 解密数据
        - 第 4 步 · 浏览聊天
        - 第 5 步 · 导出
        - 命令行（CLI）
        - 打包 / 安装
        - 其它
    validations:
      required: true

  - type: input
    id: error-code
    attributes:
      label: 错误码（如有）
      description: 界面或日志中出现的 ERR_* 代码
      placeholder: "ERR_LOGIN_TIMEOUT"

  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息
      description: |
        可粘贴 `chattrace doctor` 的输出（**请先自行检查并删除任何路径中的隐私信息**）、
        或界面提示的文字。日志中不含密钥与聊天明文，但可能含账号目录名，请按需打码。
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: 截图（可选）
      description: 涉及聊天内容时请先打码；**不要**上传未处理的私人聊天截图

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认本报告中**不包含**主密钥、完整聊天明文或他人隐私数据
          required: true
        - label: 我已阅读新手指南的 FAQ 与错误码对照表，确认不是已知问题
          required: true
